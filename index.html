<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#e5e7eb;--acc:#b91c1c;--acc2:#fef2f2;--ok:#15803d;--okbg:#ecfdf5;--warn:#b45309;--warnbg:#fffbeb;--err:#b91c1c;--errbg:#fef2f2;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
header{position:sticky;top:0;z-index:20;background:#1f2937;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
header .brand{font-weight:700;letter-spacing:.2px;white-space:nowrap}
header .brand small{font-weight:400;opacity:.65;margin-left:6px}
header nav{display:flex;gap:2px;margin-left:8px;overflow-x:auto}
header nav a{text-decoration:none;padding:6px 12px;border-radius:8px;opacity:.75;white-space:nowrap}
header nav a.on{background:rgba(255,255,255,.14);opacity:1}
header .sp{flex:1}
header .sync{font-size:12px;opacity:.8;white-space:nowrap}
.hbtn{background:rgba(255,255,255,.12);border:0;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.22)}
@media(max-width:700px){header{flex-wrap:wrap;gap:8px;padding:8px 12px}header nav{order:5;width:100%;margin:0}header .sync{display:none}header .brand small{display:none}.ev .t{font-size:13px}}
.demo{background:#fbbf24;color:#1f2937;text-align:center;font-size:12px;padding:4px 8px}
main{max-width:1280px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin:18px 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.in,select.in,textarea.in{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;min-width:0}
textarea.in{width:100%;resize:vertical;min-height:60px}
.in:focus{outline:2px solid #93c5fd;border-color:#93c5fd}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f9fafb}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#374151}
.btn.red{color:var(--err)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.mut{color:var(--mut)}
.small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:99px;background:#f3f4f6;color:#374151;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.err{background:var(--errbg);color:var(--err)}
.chip.blue{background:#eff6ff;color:#1d4ed8}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
/* agenda */
.day{margin-bottom:18px}
.day>.dh{font-weight:700;margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.day>.dh .mut{font-weight:400;font-size:12px}
.ev{display:grid;grid-template-columns:4px 104px 1fr auto;gap:12px;align-items:center;padding:10px 12px 10px 0;margin-bottom:6px;cursor:pointer;text-decoration:none}
.ev:hover{border-color:#cbd5e1;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.ev .bar4{align-self:stretch;border-radius:var(--r) 0 0 var(--r)}
.ev .t{font-variant-numeric:tabular-nums;font-weight:600}
.ev .t small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.ev .ttl{font-weight:600}
.ev .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.ev.cancel{opacity:.5}
.ev.cancel .ttl{text-decoration:line-through}
.ov{font-size:11.5px;color:var(--warn);margin-top:2px}
@media(max-width:640px){.ev{grid-template-columns:4px 64px 1fr}.ev>.chips{grid-column:3}}
/* detalle */
.dhead{padding:14px 16px;margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.dhead .info{flex:1;min-width:240px}
.dhead .ttl{font-size:18px;font-weight:700;margin:2px 0}
.dhead .acts{display:flex;gap:6px;flex-wrap:wrap}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs2 a{padding:9px 14px;text-decoration:none;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tabs2 a.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.tabs2 .n{background:#e5e7eb;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px}
.tabs2 .n.hot{background:var(--acc);color:#fff}
.split{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.aside{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;padding:12px}
@media(max-width:900px){.aside{position:static;max-height:none}}
.note{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#fff}
.note.pend{border-left:4px solid var(--acc)}
.note.done{border-left:4px solid var(--ok);opacity:.75}
.note .nh{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut);margin-bottom:6px;flex-wrap:wrap}
.note .nt{white-space:pre-wrap;word-break:break-word}
.note .subj{font-weight:600;color:var(--ink)}
.sec{padding:4px 16px 14px;margin-bottom:12px}
.fld{display:grid;grid-template-columns:190px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #f3f4f6;align-items:start}
.fld:last-child{border-bottom:0}
.fld>label{font-weight:600;font-size:12.5px;padding-top:7px;text-transform:uppercase;letter-spacing:.2px}
.fld .fixed{background:#eff6ff;color:#1e40af;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:6px;white-space:pre-wrap}
@media(max-width:640px){.fld{grid-template-columns:1fr;gap:4px}.fld>label{padding-top:0}}
.alert{padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:13px}
.alert.err{background:var(--errbg);color:var(--err)}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.alert.ok{background:var(--okbg);color:var(--ok)}
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t.fix{table-layout:fixed}
table.t th,table.t td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:11.5px;text-transform:uppercase;color:var(--mut);font-weight:600;background:#fafafa;position:sticky;top:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#f9fafb}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:#f9fafb;width:28px;height:28px;cursor:pointer}
.qty span{min-width:30px;text-align:center;font-weight:600}
.free{font-variant-numeric:tabular-nums}
.free.z{color:var(--err);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.grid2>.card{min-width:0}
.win{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:12px 14px;margin-bottom:12px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:5vh 12px;overflow:auto}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:12px;width:100%;max-width:760px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#modal .box.narrow{max-width:480px}
#modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#modal .mh h2{margin:0;flex:1}
.form{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;align-items:center}
.form label{font-size:12.5px;font-weight:600}
@media(max-width:560px){.form{grid-template-columns:1fr}}
.pick{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pick .row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid #f3f4f6}
.pick .row.dis{opacity:.45}
.pick .grp{background:#f9fafb;font-size:11.5px;font-weight:700;text-transform:uppercase;color:var(--mut);padding:6px 10px;position:sticky;top:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:90vw}
.login{max-width:420px;margin:12vh auto;text-align:center;padding:30px}
.empty{padding:30px;text-align:center;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg a{padding:6px 12px;text-decoration:none;color:var(--mut);cursor:pointer}
.seg a.on{background:var(--ink);color:#fff}
</style>

  if(!yid){ if(!create) return null; yid=(await driveMkdir(root,String(y))).id; }
  let mid=await driveFind(yid,monthName(m));
  if(!mid){ if(!create) return null; mid=(await driveMkdir(yid,monthName(m))).id; }
  DB.set(`settings/driveMonths/${key}`,mid); return mid;
}
function folderNameFor(ev){
  const p=parts(ev.start); const t=ev.allDay?'':` ${p.M?pad(p.H)+':'+pad(p.M):p.H}H`;
  return `[${p.d} ${MESES[p.m-1].slice(0,3).toUpperCase()} (${DIA_LETRA[p.wd]})${t}] ${ev.code?`[${ev.code}] `:''}${ev.name}`.toUpperCase();
}
const STOP=new Set(['PARA','CON','DEL','LOS','LAS','UNA','POR','QUE','SOBRE','ENTRE']);
const words = s => new Set(norm(s).replace(/[^A-Z0-9Ñ ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)&&!/^\d+H?$/.test(w)));
function folderScore(ev,f){
  const n=norm(f.name); const m=n.match(/^\[([^\]]*)\]\s*(?:\[([^\]]*)\])?\s*(.*)$/);
  if(!m) return 0;
  const p=parts(ev.start); const head=m[1];
  const dm=head.match(/^([\d,\sY]+?)\s*[A-Z]{3}/); const days=dm?(dm[1].match(/\d+/g)||[]).map(Number):[];
  if(!days.includes(p.d)) return 0;
  let s=3;
  const codes=(m[2]||'')+' '+head;
  if(ev.code&&new RegExp('(^|[^A-Z])'+norm(ev.code)+'([^A-Z]|$)').test(codes)) s+=2;
  const a=words(ev.name), b=words(m[3]); let inter=0; a.forEach(w=>{if(b.has(w))inter++});
  const ov=a.size&&b.size?inter/Math.min(a.size,b.size):0; s+=ov*4;
  if(!ev.allDay){const hh=p.M?`${p.H}:${pad(p.M)}H`:`${p.H}H`; if(head.includes(hh)) s+=1;}
  return s;
}
async function matchActFolder(ev){
  const p=parts(ev.start); const mid=await monthFolderId(p.y,p.m,false);
  if(!mid) return {best:null,list:[],monthId:null};
  const list=(await driveListFolders(mid)).map(f=>({...f,score:folderScore(ev,f)})).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
  const [f1,f2]=list; const ok=f1&&f1.score>=5.5&&(!f2||f1.score-f2.score>=1.5);
  return {best:ok?f1:null,list,monthId:mid};
}
function linkFolder(id,f,auto){return DB.set(`events/${id}/driveFolder`,{id:f.id,name:f.name,url:f.webViewLink||`https://drive.google.com/drive/folders/${f.id}`,auto:!!auto,at:Date.now(),by:DB.user?.name||''})}
async function autoLinkFolders(){ // tras sincronizar: vincula carpetas de los próximos 45 días si el emparejamiento es claro
  if(!S().driveFolderId) return 0;
  const lim=Date.now()+45*864e5, from=Date.now()-S().daysBack*864e5; const evs=allEvents().filter(e=>!e.cancelled&&!e.raw.driveFolder&&e.end.getTime()>=from&&e.start.getTime()<=lim);
  const byM={}; evs.forEach(e=>{const p=parts(e.start);(byM[p.y+'-'+p.m]=byM[p.y+'-'+p.m]||[]).push(e)});
  let n=0;
  for(const [k,list] of Object.entries(byM)){
    const [y,m]=k.split('-').map(Number); const mid=await monthFolderId(y,m,false); if(!mid) continue;
    const fs=await driveListFolders(mid);
    for(const ev of list){const sc=fs.map(f=>({...f,score:folderScore(ev,f)})).sort((a,b)=>b.score-a.score);
      const [f1,f2]=sc; if(f1&&f1.score>=5.5&&(!f2||f1.score-f2.score>=1.5)){await linkFolder(ev.id,f1,true);n++}}
  }
  return n;
}
/* Hojas hechas fuera de la app: se buscan en la carpeta del acto */
async function findSheetIn(folderId){
  let out=[],page='';
  do{const q=encodeURIComponent(`'${folderId}' in parents and trashed=false and mimeType!='${FOLDER_MIME}'`);
    const j=await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name,webViewLink,modifiedTime,mimeType,lastModifyingUser(displayName))&pageSize=200&supportsAllDrives=true&includeItemsFromAllDrives=true${page?'&pageToken='+page:''}`);
    out=out.concat(j.files||[]);page=j.nextPageToken||'';}while(page);
  return out.filter(f=>norm(f.name).replace(/[^A-Z]/g,'').includes('HOJADESERVICIO')).sort((a,b)=>(b.modifiedTime||'').localeCompare(a.modifiedTime||''));
}
async function detectSheet(id){
  const ev=E(id); const fo=ev?.raw.driveFolder; if(!fo) return false;
  const list=await findSheetIn(fo.id);
  const mine=ev.raw.drive?.fileId; const ext=list.find(f=>f.id!==mine);
  await DB.update({[`events/${id}/driveFolder/checked`]:Date.now(),
    [`events/${id}/driveExt`]:ext?{fileId:ext.id,url:ext.webViewLink,name:ext.name,modified:ext.modifiedTime||'',by:ext.lastModifyingUser?.displayName||'',count:list.filter(f=>f.id!==mine).length}:null});
  return !!ext;
}
async function detectSheets(){
  const from=Date.now()-S().daysBack*864e5; let n=0;
  for(const ev of allEvents()){
    const fo=ev.raw.driveFolder; if(!fo||ev.cancelled||ev.end.getTime()<from) continue;
    if(fo.checked&&Date.now()-fo.checked<3*36e5) continue;
    if(await detectSheet(ev.id)) n++;
  }
  return n;
}

async function saveToDrive(id){
  const ev=E(id); const st=S();
  let folder=ev.raw.driveFolder;
  if(!folder){
    const r=await matchActFolder(ev);
    if(r.best){await linkFolder(id,r.best,true);folder={id:r.best.id}}

  }
  if(ev.raw.driveExt&&!ev.drive&&!confirm(`Este acto ya tiene una hoja hecha fuera de la app:\n«${ev.raw.driveExt.name}»\n\nLa app NO la va a modificar: creará otra hoja nueva, marcada «(app)», en la misma carpeta. ¿Continuar?`)) return;
  const blob=await buildDocx(ev); const name=fileName(ev)+(ev.raw.driveExt?' (app)':'');
  const gdoc=st.driveFormat!=='docx';
  const meta={name:gdoc?name:name+'.docx',mimeType:gdoc?'application/vnd.google-apps.document':'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};
  const fd=()=>{const f=new FormData();f.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));f.append('file',blob);return f};

    try{res=await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${ev.drive.fileId}?uploadType=multipart&supportsAllDrives=true&fields=id,webViewLink`,{method:'PATCH',body:fd()})}catch(e){res=null}
  }
  if(!res){meta.parents=[folder.id];
    res=await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id,webViewLink',{method:'POST',body:fd()})}
  await DB.set(`events/${id}/drive`,{fileId:res.id,url:res.webViewLink,at:Date.now(),by:DB.user?.name||'',name,fmt:gdoc?'gdoc':'docx',folderId:folder.id});

}

function sheetForm(id){

  const input=(k,type)=>{
    const v=sheetVal(ev,k); const d=`data-sheet="${k}" data-id="${id}"`;
    if(type==='auto') return `<input class="in" style="width:100%" ${d} value="${h(v)}">`;
    if(type==='text') return `<input class="in" style="width:100%" ${d} value="${h(v)}">`;
    if(type==='area') return (FIXED[k]?`<div class="fixed">${h(FIXED[k])}</div>`:'')+`<textarea class="in" rows="${Math.min(12,Math.max(2,String(v).split('\n').length+1))}" ${d} placeholder="${FIXED[k]?'Añadir más (opcional)…':''}">${h(v)}</textarea>`;
    if(type==='sel') return `<select class="in" ${d}><option value="">SELECCIONAR</option>${OPT[k].map(o=>`<option ${v===o?'selected':''}>${h(o)}</option>`).join('')}</select>`;
    if(type==='room') return `<select class="in" data-act-change="room" data-id="${id}"><option value="">SELECCIONAR</option>${ROOMS.map(o=>`<option ${ev.room===o?'selected':''}>${o}</option>`).join('')}</select> ${ev.raw.room?`<span class="small mut">elegida a mano</span>`:ev.code?`<span class="small mut">desde [${h(ev.code)}]</span>`:''}`;
    if(type==='cit') return `<input type="time" class="in" data-win="cit" data-id="${id}" value="${ev.cit}"> <span class="small mut">Fin desmontaje</span> <input type="time" class="in" data-win="fin" data-id="${id}" value="${ev.fin}"> <span class="small mut">(reserva el material)</span>`;
    if(type==='mat'){const g=matByOrigin(ev);const blk=(t,l)=>l?`<div style="margin-bottom:6px"><b class="small">${t}</b><div class="nt small" style="white-space:pre-wrap">${h(l)}</div></div>`:'';
      const v2=sheetValues(ev);const any=v2.MAT_ATENEO+v2.MAT_SCOPE+v2.MAT_OFICINA+v2.MAT_ALQUILADO;
      return (any?blk('Ateneo',v2.MAT_ATENEO)+blk('Scope',v2.MAT_SCOPE)+blk('Scope oficina',v2.MAT_OFICINA)+blk('Alquilado',v2.MAT_ALQUILADO)+blk('Traslados entre salas',v2.MAT_TRASLADOS):'<span class="small mut">Sin material asignado.</span>')+` <a class="btn sm" href="#ev/${id}/mat">Gestionar material →</a>`}
  };
  const upd=ev.raw.sheet?._u;
  return `${upd?`<div class="small mut" style="margin-bottom:8px">Última edición: ${h(upd.by)} · ${relTime(upd.ts)}</div>`:''}`+
    SECTIONS.map(s=>`<div class="card sec"><h3>${s.t}</h3>${s.f.map(([k,l,t])=>`<div class="fld"><label>${l}</label><div>${input(k,t)}</div></div>`).join('')}</div>`).join('');
}
function winHtml(id){
  const ev=E(id); if(!ev) return '';
  return `<div class="card win"><b>Franja de uso del material</b>
    <span class="small mut">Citación</span><input type="time" class="in" data-win="cit" data-id="${id}" value="${ev.cit}">
    <span class="small mut">Fin desmontaje</span><input type="time" class="in" data-win="fin" data-id="${id}" value="${ev.fin}">
    <span class="small mut">Acto ${ev.allDay?'todo el día':hm(ev.start)+'–'+hm(ev.end)} en <b>${h(ev.room||'?')}</b></span>
    <span style="flex:1"></span>
    <button class="btn" data-act="copyMat" data-id="${id}">Copiar de otro acto</button>
    <button class="btn" data-act="addRent" data-id="${id}">+ Alquilado</button>
    <button class="btn pri" data-act="pick" data-id="${id}">+ Añadir material</button></div>`;
}
function matHtml(id){
  const ev=E(id); if(!ev) return '';
  const items=ITEMS(); const rows=Object.entries(ev.mat).map(([iid,a])=>({iid,a,it:items[iid]})).filter(r=>r.it);
  if(!rows.length) return `<div class="empty card">Sin material asignado. Usa «+ Añadir material».<br><span class="small">El equipo propio de ${h(ev.room||'la sala')} también se puede añadir aquí para tenerlo controlado.</span></div>`;
  const grp={}; rows.forEach(r=>(grp[r.it.origin]=grp[r.it.origin]||[]).push(r));
  return Object.keys(ORIGINS).filter(o=>grp[o]).map(o=>`<h3>${ORIGINS[o].label}</h3><div class="tw"><table class="t"><thead><tr><th>Equipo</th><th>Procede de</th><th>Cantidad</th><th class="num">Libres</th><th>Nota</th><th></th></tr></thead><tbody>
    ${grp[o].sort((x,y)=>x.it.name.localeCompare(y.it.name)).map(({iid,a,it})=>{
      const {used}=usageAt(iid,ev,ev.id); const free=(+it.qty||0)-used-a.qty;
      const tras=it.origin==='ateneo'&&ev.room&&it.baseRoom!==ev.room;
      return `<tr><td><b>${h(it.name)}</b>${it.category?`<div class="small mut">${h(it.category)}</div>`:''}</td>
      <td>${h(whereOf(it))}${tras?`<div><span class="chip warn">Traslado → ${h(ev.room)}</span></div>`:''}${it.origin==='oficina'?'<div><span class="chip blue">Traer de oficina</span></div>':''}</td>
      <td><span class="qty"><button data-act="q" data-id="${id}" data-i="${iid}" data-d="-1">−</button><span>${a.qty}</span><button data-act="q" data-id="${id}" data-i="${iid}" data-d="1">+</button></span></td>
      <td class="num"><span class="free ${free<0?'z':''}">${free<0?'Faltan '+(-free):free}</span><div class="small mut">de ${it.qty}</div></td>
      <td><input class="in" style="width:100%;min-width:120px" data-matnote="${iid}" data-id="${id}" value="${h(a.note||'')}" placeholder="p. ej. para el atril"></td>
      <td><button class="btn sm red" data-act="unassign" data-id="${id}" data-i="${iid}">Quitar</button></td></tr>`}).join('')}
    </tbody></table></div>`).join('');
}

/* ---------- selector de material (modal) ---------- */
const MODAL={parts:null,st:{}};
function openModal(html,parts,narrow){const m=$('#modal');m.innerHTML=`<div class="box ${narrow?'narrow':''}">${html}</div>`;m.classList.add('on');MODAL.parts=parts||{};renderModalParts(true)}
function closeModal(){$('#modal').classList.remove('on');$('#modal').innerHTML='';MODAL.parts=null}
function renderModalParts(force){if(!MODAL.parts)return;$('#modal').querySelectorAll('[data-mpart]').forEach(el=>{const fn=MODAL.parts[el.dataset.mpart];if(!fn)return;const a=document.activeElement;if(!force&&el.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a?.tagName))return;el.innerHTML=fn()})}
function openPicker(id){
  const ev=E(id); MODAL.st={id,q:'',origin:'',room:''};
  openModal(`<div class="mh"><h2>Añadir material · ${h(ev.room||'')}</h2><button class="btn" data-act="close">Cerrar</button></div>
    <div class="small mut" style="margin-bottom:8px">Disponibilidad calculada para ${shortDate(ev.start)} de ${ev.cit} a ${ev.fin}, contando los demás actos que se solapan.</div>
    <div class="bar"><input class="in" style="flex:1" placeholder="Buscar (diadema, SM58, XLR…)" data-mst="q" autofocus>
    <select class="in" data-mst="origin"><option value="">Todo el material</option>${Object.entries(ORIGINS).map(([k,o])=>`<option value="${k}">${o.label}</option>`).join('')}</select>
    <select class="in" data-mst="room"><option value="">Todas las salas</option>${ROOMS.map(r=>`<option>${r}</option>`).join('')}</select></div>
    <div class="pick" data-mpart="list"></div>`,{list:pickerList});
}
function pickerList(){
  const {id,q,origin,room}=MODAL.st; const ev=E(id); if(!ev) return '';
  const qq=q.toLowerCase().split(/\s+/).filter(Boolean);
  let list=Object.entries(ITEMS()).map(([iid,it])=>({iid,it})).filter(({it})=>(!origin||it.origin===origin)&&(!room||it.baseRoom===room)&&(it.origin!=='alquiler'||it.eventId===id||!it.eventId)&&qq.every(w=>(it.name+' '+(it.desc||'')+' '+(it.category||'')+' '+(it.baseRoom||'')+' '+(it.location||'')).toLowerCase().includes(w)));
  const order=it=>it.origin==='ateneo'?(it.baseRoom===ev.room?0:2):it.origin==='scope'?1:it.origin==='oficina'?3:4;
  list.sort((a,b)=>order(a.it)-order(b.it)||(a.it.baseRoom||'').localeCompare(b.it.baseRoom||'')||(a.it.category||'').localeCompare(b.it.category||'')||a.it.name.localeCompare(b.it.name));
  if(!list.length) return '<div class="empty">Nada coincide.</div>';
  let last=''; let out='';
  for(const {iid,it} of list){
    const g=it.origin==='ateneo'?(it.baseRoom===ev.room?`Equipo de ${it.baseRoom} (esta sala)`:`Ateneo · ${it.baseRoom}`):ORIGINS[it.origin].label;
    if(g!==last){out+=`<div class="grp">${h(g)}</div>`;last=g}
    const {used,by}=usageAt(iid,ev,id); const mine=ev.mat[iid]?.qty||0; const free=(+it.qty||0)-used-mine; const bad=isBad(it);
    out+=`<div class="row ${bad?'dis':''}"><div><b>${h(it.name)}</b>${it.desc?` <span class="small">${h(it.desc)}</span>`:''} <span class="small mut">· ${h(it.category||'')}${it.origin!=='ateneo'&&it.location?' · '+h(it.location):''}${bad?' · '+h(it.status):''}</span>
      ${by.length?`<div class="small" style="color:var(--warn)">Ocupado: ${by.map(b=>`${h(b.ev.room||'?')} ${hm(b.ev.start)} (${b.q})`).join(', ')}</div>`:''}</div>
      <div class="free ${free<=0?'z':''} small">${free} libre${free===1?'':'s'} / ${it.qty}${mine?` · <b>${mine} en este acto</b>`:''}</div>
      <button class="btn sm ${free>0&&!bad?'pri':''}" data-act="assign" data-id="${id}" data-i="${iid}" ${bad?'disabled':''}>+1</button></div>`;
  }
  return out;
}
function openRent(id,itemId){
  const it=itemId?ITEMS()[itemId]:{}; const ev=id?E(id):null;
  openModal(`<div class="mh"><h2>${itemId?'Editar alquiler':'Material alquilado'}</h2><button class="btn" data-act="close">Cerrar</button></div>
  <div class="form">
    <label>Equipo</label><input class="in" id="rName" value="${h(it.name||'')}" placeholder="p. ej. Proyector Epson 7000 lm">
    <label>Cantidad</label><input class="in" id="rQty" type="number" min="1" value="${it.qty||1}">
    <label>Proveedor</label><input class="in" id="rSup" value="${h(it.supplier||'')}">
    <label>Recogida</label><input class="in" id="rFrom" type="date" value="${h(it.rentFrom||(ev?ymd(ev.start):''))}">
    <label>Devolución</label><input class="in" id="rTo" type="date" value="${h(it.rentTo||(ev?ymd(ev.end):''))}">
    <label>Notas</label><input class="in" id="rNotes" value="${h(it.notes||'')}" placeholder="presupuesto, contacto…">
  </div><div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="btn pri" data-act="saveRent" data-id="${id||''}" data-i="${itemId||''}">Guardar</button></div>`,null,true);
}
function openCopy(id){
  const ev=E(id);
  const cands=allEvents().filter(o=>o.id!==id&&Object.keys(o.mat).length).sort((a,b)=>(b.room===ev.room)-(a.room===ev.room)||Math.abs(a.start-ev.start)-Math.abs(b.start-ev.start)).slice(0,40);
  openModal(`<div class="mh"><h2>Copiar material de otro acto</h2><button class="btn" data-act="close">Cerrar</button></div>
  <div class="small mut" style="margin-bottom:8px">Se suma al material ya asignado (sin alquileres).</div>
  <div class="pick">${cands.length?cands.map(o=>`<div class="row"><div><b>${h(o.name)}</b><div class="small mut">${h(o.room||'?')} · ${shortDate(o.start)} ${hm(o.start)} · ${Object.keys(o.mat).length} equipos</div></div><span></span><button class="btn sm pri" data-act="doCopy" data-id="${id}" data-from="${o.id}">Copiar</button></div>`).join(''):'<div class="empty">No hay otros actos con material.</div>'}</div>`);
}

/* ---------------- MATERIAL (vistas globales) ---------------- */
function mountMaterial(){
  if(!UI.avDate){const n=new Date();UI.avDate=ymd(n);UI.avFrom=pad(parts(n).H)+':00';UI.avTo=pad(Math.min(23,parts(n).H+3))+':00'}
  mount('material',`<div class="bar"><span class="seg" data-part="seg"></span></div><div data-part="mtop"></div><div data-part="mbody"></div>`,{
    seg:()=>[['free','¿Qué hay libre?'],['tras','Traslados'],['out','Oficina y alquiler']].map(([k,l])=>`<a class="${UI.matView===k?'on':''}" data-act="matView" data-v="${k}">${l}</a>`).join(''),
    mtop:()=>UI.matView==='free'?`<div class="bar"><input type="date" class="in" data-ui="avDate" value="${UI.avDate}"> de <input type="time" class="in" data-ui="avFrom" value="${UI.avFrom}"> a <input type="time" class="in" data-ui="avTo" value="${UI.avTo}">
      <input class="in" style="flex:1;min-width:160px" placeholder="Filtrar equipo…" data-ui="avQ" value="${h(UI.avQ)}"></div>`:'<div class="small mut" style="margin-bottom:10px">Próximos 14 días.</div>',
    mbody:()=>UI.matView==='free'?freeView():UI.matView==='tras'?trasView():outView()
  });
}
function freeView(){
  const win={from:madridMs(UI.avDate,UI.avFrom||'00:00'),to:madridMs(UI.avDate,UI.avTo||'23:59')};
  if(win.to<=win.from) return '<div class="alert warn">La hora final debe ser posterior a la inicial.</div>';
  const evs=allEvents().filter(e=>!e.cancelled&&overlaps(e,win));
  const q=UI.avQ.toLowerCase();
  const rows=Object.entries(ITEMS()).filter(([,it])=>!q||(it.name+' '+(it.baseRoom||'')+' '+(it.category||'')).toLowerCase().includes(q)).map(([iid,it])=>{const u=usageAt(iid,win);return {iid,it,...u,free:(+it.qty||0)-u.used}});
  const grp={}; rows.forEach(r=>{const g=r.it.origin==='ateneo'?'Ateneo · '+r.it.baseRoom:ORIGINS[r.it.origin].label;(grp[g]=grp[g]||[]).push(r)});
  return `<div class="card" style="padding:10px 14px;margin-bottom:12px"><b>${evs.length} acto${evs.length===1?'':'s'} en esa franja</b>${evs.length?': '+evs.map(e=>`<a href="#ev/${e.id}/mat">${h(e.room||'?')} · ${hm(e.from)}–${hm(e.to)} «${h(e.name)}»</a>`).join(' · '):''}</div>`+
  Object.entries(grp).map(([g,l])=>`<h3>${h(g)}</h3><div class="tw"><table class="t fix"><colgroup><col><col style="width:80px"><col style="width:80px"><col style="width:34%"></colgroup><thead><tr><th>Equipo</th><th class="num">Total</th><th class="num">Libres</th><th>Usado en</th></tr></thead><tbody>
  ${l.sort((a,b)=>a.it.name.localeCompare(b.it.name)).map(r=>`<tr class="${isBad(r.it)?'mut':''}"><td>${h(r.it.name)}${isBad(r.it)?` <span class="chip err">${h(r.it.status)}</span>`:''}</td><td class="num">${r.it.qty}</td><td class="num"><span class="free ${r.free<=0?'z':''}">${r.free}</span></td>
    <td class="small">${r.by.map(b=>`<a href="#ev/${b.ev.id}/mat">${b.q} en ${h(b.ev.room||'?')} (${hm(b.ev.from)}–${hm(b.ev.to)})</a>`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`).join('');
}
function trasView(){
  const lim=Date.now()+14*864e5; const items=ITEMS(); const rows=[];
  allEvents().filter(e=>!e.cancelled&&e.to>=Date.now()&&e.from<=lim).forEach(e=>Object.entries(e.mat).forEach(([iid,a])=>{const it=items[iid];if(it&&it.origin==='ateneo'&&e.room&&it.baseRoom!==e.room)rows.push({e,it,a})}));
  if(!rows.length) return '<div class="empty card">No hay traslados entre salas previstos.</div>';
  return `<div class="tw"><table class="t"><thead><tr><th>Cuándo</th><th>Equipo</th><th>De</th><th>A</th><th>Acto</th></tr></thead><tbody>${rows.map(({e,it,a})=>`<tr class="click" data-href="#ev/${e.id}/mat"><td>${shortDate(e.start)}<div class="small mut">${e.cit} → ${e.fin}</div></td><td><b>${a.qty} ×</b> ${h(it.name)}</td><td><span class="dot" style="background:${ROOM_COLORS[it.baseRoom]}"></span> ${h(it.baseRoom)}</td><td><span class="dot" style="background:${ROOM_COLORS[e.room]}"></span> ${h(e.room)}</td><td>${h(e.name)}</td></tr>`).join('')}</tbody></table></div>`;
}
function outView(){
  const lim=Date.now()+14*864e5; const items=ITEMS(); const rows=[];
  allEvents().filter(e=>!e.cancelled&&e.to>=Date.now()&&e.from<=lim).forEach(e=>Object.entries(e.mat).forEach(([iid,a])=>{const it=items[iid];if(it&&(it.origin==='oficina'||it.origin==='alquiler'))rows.push({e,it,a})}));
  if(!rows.length) return '<div class="empty card">No hay material de oficina ni alquilado previsto.</div>';
  return `<div class="tw"><table class="t"><thead><tr><th>Cuándo</th><th>Equipo</th><th>Origen</th><th>Acto</th></tr></thead><tbody>${rows.map(({e,it,a})=>`<tr class="click" data-href="#ev/${e.id}/mat"><td>${shortDate(e.start)}<div class="small mut">cit. ${e.cit}</div></td><td><b>${a.qty} ×</b> ${h(it.name)}</td><td><span class="chip ${it.origin==='alquiler'?'warn':'blue'}">${ORIGINS[it.origin].short}</span> <span class="small">${h(it.origin==='alquiler'?[it.supplier,it.rentFrom&&'recogida '+it.rentFrom,it.rentTo&&'devolución '+it.rentTo].filter(Boolean).join(' · '):(it.location||''))}</span></td><td>${h(e.room||'?')} · ${h(e.name)}</td></tr>`).join('')}</tbody></table></div>`;
}

    <label>Observaciones</label><input class="in" id="iNotes" value="${h(it.notes||'')}">
  </div>
  <div style="margin-top:14px;display:flex;gap:8px">${iid?`<button class="btn red" data-act="delItem" data-i="${iid}">Eliminar</button>`:''}<span style="flex:1"></span><button class="btn pri" data-act="saveItem" data-i="${iid||''}">Guardar</button></div>`);
}

/* ---------------- AJUSTES ---------------- */
function mountSettings(){
  const st=S();
  mount('ajustes',`<div class="grid2">
  <div class="card" style="padding:16px"><h3 style="margin-top:0">Calendario y Drive</h3><div class="form">
    <label>ID calendario Ateneo</label><input class="in" data-set="calendarId" value="${h(st.calendarId)}">
    <label>Carpeta INFORMACIÓN ACTOS</label><input class="in" data-set="driveFolderId" value="${h(st.driveFolderId)}" placeholder="Pega el enlace de la carpeta">
    <label>Formato en Drive</label><select class="in" data-set="driveFormat"><option value="gdoc" ${st.driveFormat!=='docx'?'selected':''}>Documento de Google</option><option value="docx" ${st.driveFormat==='docx'?'selected':''}>Archivo .docx</option></select>
    <label>Días hacia atrás</label><input class="in" type="number" data-set="daysBack" value="${st.daysBack}">
    <label>Días hacia delante</label><input class="in" type="number" data-set="daysAhead" value="${st.daysAhead}">
  </div><p class="small mut">Cada hoja se guarda en la carpeta de su acto: INFORMACIÓN ACTOS / 2026 / 11 NOVIEMBRE / [20 NOV (V) 19H] [CAT] …. La app vincula sola la carpeta cuando la fecha, el código y el título coinciden; si no está clara, te deja elegirla. El calendario se sincroniza al abrir la app y cada 10 minutos mientras alguien la tenga abierta.</p>
  <div class="small" data-part="syncinfo"></div></div>
  <div class="card" style="padding:16px"><h3 style="margin-top:0">Reserva de material por defecto</h3><div class="form">
    <label>Citación</label><span><input class="in" type="number" style="width:80px" data-set="citMin" value="${st.citMin}"> min antes del acto</span>
    <label>Fin desmontaje</label><span><input class="in" type="number" style="width:80px" data-set="desmMin" value="${st.desmMin}"> min después</span>
  </div><p class="small mut">Cada acto se puede ajustar a mano. Durante esa franja el material queda ocupado para los demás actos.</p></div>
  <div class="card" style="padding:16px"><h3 style="margin-top:0">Códigos de sala del calendario</h3><p class="small mut" style="margin-top:0">Los eventos empiezan por un código entre corchetes, p. ej. <b>[CAT]</b>. Asigna cada código a su sala.</p><div data-part="codes"></div></div>
  <div class="card" style="padding:16px"><h3 style="margin-top:0">Datos</h3>
    <p class="small">${DB.mode==='local'?'Modo prueba (datos en este navegador).':'Conectado a Firebase como <b>'+h(DB.user?.email)+'</b>.'}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="export">Exportar copia (JSON)</button><button class="btn" data-act="import">Importar copia</button>
    <button class="btn" data-act="exportInv">Inventario a CSV</button>
    ${DB.mode==='local'?'<button class="btn red" data-act="resetDemo">Reiniciar datos de prueba</button>':''}</div>
    <input type="file" id="impFile" accept=".json" style="display:none"></div>
  </div>`,{codes:codesTable,syncinfo:()=>{const l=S().lastSync;return l?`Última sincronización: ${relTime(l.ts)} por ${h(l.by)} (${l.count} eventos)`:''}});
}
function codesTable(){
  const st=S(); const found={}; allEvents().forEach(e=>{if(e.code)found[e.code]=(found[e.code]||0)+1});
  const codes=[...new Set([...Object.keys(st.roomCodes),...Object.keys(found)])].sort((a,b)=>(found[b]||0)-(found[a]||0)||a.localeCompare(b));
  return `<div class="tw"><table class="t"><thead><tr><th>Código</th><th>Sala</th><th class="num">Eventos</th><th></th></tr></thead><tbody>${codes.map(c=>`<tr><td><b>[${h(c)}]</b></td><td><select class="in" style="max-width:170px" data-code="${h(c)}"><option value="">— sin asignar —</option>${ROOMS.map(r=>`<option ${st.roomCodes[c]===r?'selected':''}>${r}</option>`).join('')}</select></td><td class="num">${found[c]||0}</td><td>${st.roomCodes[c]!==undefined?`<button class="btn sm red" data-act="delCode" data-c="${h(c)}" title="Borrar código">Borrar</button>`:''}</td></tr>`).join('')}</tbody></table></div>
  <div class="bar" style="margin-top:8px"><input class="in" id="newCode" placeholder="Nuevo código, p. ej. SAL" style="width:170px"><button class="btn" data-act="addCode">Añadir</button></div>`;
}

/* ---------------- eventos de interfaz ---------------- */
const deb={};
function debounce(k,fn,ms=450){clearTimeout(deb[k]);deb[k]=setTimeout(fn,ms)}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ui){UI[t.dataset.ui]=t.type==='checkbox'?t.checked:t.value;renderParts(false);return}
  if(t.dataset.mst!==undefined){MODAL.st[t.dataset.mst]=t.value;renderModalParts(false);return}
  if(t.dataset.sheet){const id=t.dataset.id,k=t.dataset.sheet,v=t.value;debounce('s'+id+k,()=>DB.update({[`events/${id}/sheet/${k}`]:v===''&&!['ACTO','FECHA','HORARIO','BUP','GRAB_AUDIO'].includes(k)?null:v,[`events/${id}/sheet/_u`]:stamp()}));return}
  if(t.dataset.matnote){const id=t.dataset.id,i=t.dataset.matnote;debounce('m'+id+i,()=>DB.update({[`events/${id}/mat/${i}/note`]:t.value||null,[`events/${id}/_matU`]:stamp()}));return}
  if(t.dataset.set&&t.tagName==='INPUT'){const k=t.dataset.set;let v=t.value.trim();if(k==='driveFolderId'){const m=v.match(/folders\/([\w-]+)/);if(m)v=m[1]}if(['citMin','desmMin','daysBack','daysAhead'].includes(k))v=+v||0;debounce('set'+k,()=>{DB.set('settings/'+k,v);if(k==='driveFolderId')DB.set('settings/driveMonths',null)},600)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ui&&t.tagName==='SELECT'){UI[t.dataset.ui]=t.value;renderParts(false)}
  if(t.dataset.set&&t.tagName==='SELECT') DB.set('settings/'+t.dataset.set,t.value);
  if(t.dataset.win){const id=t.dataset.id;DB.update({[`events/${id}/win/${t.dataset.win}`]:t.value||null,[`events/${id}/_matU`]:stamp()})}
  if(t.dataset.actChange==='room'){const id=t.dataset.id;DB.update({[`events/${id}/room`]:t.value||null,[`events/${id}/sheet/_u`]:stamp()})}
  if(t.dataset.code!==undefined){DB.set('settings/roomCodes/'+t.dataset.code,t.value||'-')}
  if(t.id==='impFile'&&t.files[0]){t.files[0].text().then(txt=>{try{const d=JSON.parse(txt);if(!confirm('Esto sustituye TODOS los datos por los del archivo. ¿Seguro?'))return;if(DB.mode==='firebase')DB.ref('').set(d);else{DB.data=d;DB.persist();schedule()}toast('Copia importada')}catch(err){toast('Archivo no válido')}})}
});
document.addEventListener('click',async e=>{
  const tr=e.target.closest('tr[data-href]'); if(tr){location.hash=tr.dataset.href;return}
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(e.target===$('#modal')) return;
  const a=b.dataset.act, id=b.dataset.id, i=b.dataset.i;
  try{switch(a){
    case 'sync': return syncCalendar(true);
    case 'who': if(DB.mode==='local'){const n=prompt('¿Tu nombre? (aparece en las notas)',DB.user.name);if(n){localStorage.setItem('ateneo-name',n);DB.user.name=n}}else if(confirm('¿Cerrar sesión?')){sessionStorage.removeItem('gtok');firebase.auth().signOut()} return;
    case 'close': return closeModal();
    case 'addNote':{const tx=$('#nText').value.trim();if(!tx)return toast('Pega primero el texto del email');const nid=uid('n');
      await DB.set(`events/${id}/notes/${nid}`,{text:tx,subj:$('#nSubj').value.trim()||null,ts:Date.now(),by:DB.user.name,done:false});$('#nText').value='';$('#nSubj').value='';toast('Añadido como pendiente');return}
    case 'toggleNote':{const n=E(id).notes[b.dataset.n];return DB.update({[`events/${id}/notes/${b.dataset.n}/done`]:!n.done,[`events/${id}/notes/${b.dataset.n}/doneBy`]:n.done?null:DB.user.name})}
    case 'delNote': if(confirm('¿Borrar esta información?')) DB.set(`events/${id}/notes/${b.dataset.n}`,null); return;
    case 'docx': return downloadDocx(id);
    case 'drive': b.disabled=true;b.textContent='Guardando…';try{await saveToDrive(id)}finally{b.disabled=false;renderParts(true)} return;
    case 'folder': return openFolderPicker(id,false);
    case 'recheck':{toast('Buscando hoja en la carpeta…');const had=await detectSheet(id);toast(had?'Hoja encontrada':'No hay hoja de servicio en la carpeta');return}
    case 'pickFolder':{await linkFolder(id,{id:b.dataset.f,name:b.dataset.fn,webViewLink:b.dataset.u},false);closeModal();toast('Carpeta vinculada');const had=await detectSheet(id);if(had)toast('Esa carpeta ya tiene hoja de servicio');else if(b.dataset.save)await saveToDrive(id);return}
    case 'mkFolder':{const nm=$('#newFolder').value.trim();if(!nm)return;const ev=E(id);const p=parts(ev.start);const mid=await monthFolderId(p.y,p.m,true);const f=await driveMkdir(mid,nm);await linkFolder(id,f,false);closeModal();toast('Carpeta creada');if(b.dataset.save)await saveToDrive(id);return}
    case 'pick': return openPicker(id);
    case 'assign':{const ev=E(id);const cur=ev.mat[i]?.qty||0;return DB.update({[`events/${id}/mat/${i}/qty`]:cur+1,[`events/${id}/_matU`]:stamp()})}
    case 'q':{const ev=E(id);const n=(ev.mat[i]?.qty||0)+(+b.dataset.d);
      if(n<=0) return unassign(id,i); return DB.update({[`events/${id}/mat/${i}/qty`]:n,[`events/${id}/_matU`]:stamp()})}
    case 'unassign': return unassign(id,i);
    case 'addRent': return openRent(id);
    case 'saveRent':{const name=$('#rName').value.trim();if(!name)return toast('Pon el nombre del equipo');
      const iid=i||uid('al');const qty=Math.max(1,+$('#rQty').value||1);
      const it={...(ITEMS()[iid]||{}),origin:'alquiler',name,qty,supplier:$('#rSup').value.trim()||null,rentFrom:$('#rFrom').value||null,rentTo:$('#rTo').value||null,notes:$('#rNotes').value.trim()||null,category:'Alquiler',eventId:id||ITEMS()[iid]?.eventId||null};
      const up={[`items/${iid}`]:JSON.parse(JSON.stringify(it))};
      if(id&&!i){up[`events/${id}/mat/${iid}`]={qty};up[`events/${id}/_matU`]=stamp()}
      await DB.update(up);closeModal();toast('Alquiler guardado');return}
    case 'copyMat': return openCopy(id);
    case 'doCopy':{const from=E(b.dataset.from);const ev=E(id);const up={};const items=ITEMS();
      for(const [iid,x] of Object.entries(from.mat)){if(items[iid]?.origin==='alquiler')continue;up[`events/${id}/mat/${iid}/qty`]=(ev.mat[iid]?.qty||0)+x.qty;if(x.note&&!ev.mat[iid]?.note)up[`events/${id}/mat/${iid}/note`]=x.note}
      up[`events/${id}/_matU`]=stamp();await DB.update(up);closeModal();toast('Material copiado');return}
    case 'matView': UI.matView=b.dataset.v;MOUNTED='';return route();
    case 'newItem': return openItem(null);
    case 'editItem': return openItem(i);
    case 'saveItem':{const name=$('#iName').value.trim();if(!name)return toast('Falta el nombre');const iid=i||uid('it');
      const o=$('#iOrigin').value;const it={...(ITEMS()[iid]||{}),name,origin:o,baseRoom:o==='ateneo'?($('#iRoom').value||null):null,location:$('#iLoc').value.trim()||null,category:$('#iCat').value.trim()||null,qty:Math.max(0,+$('#iQty').value||0),status:$('#iSt').value.trim().toUpperCase()||null,desc:$('#iDesc').value.trim()||null,serial:$('#iSn').value.trim()||null,notes:$('#iNotes').value.trim()||null};
      if(o==='ateneo'&&!it.baseRoom) return toast('Elige la sala del Ateneo');
      await DB.set('items/'+iid,JSON.parse(JSON.stringify(it)));closeModal();toast('Guardado');return}
    case 'delItem':{const uses=allEvents().filter(ev=>ev.mat[i]&&ev.to>Date.now());if(!confirm(uses.length?`Está asignado en ${uses.length} acto(s) futuros. ¿Eliminar igualmente?`:'¿Eliminar este equipo?'))return;
      const up={[`items/${i}`]:null};uses.forEach(ev=>up[`events/${ev.id}/mat/${i}`]=null);await DB.update(up);closeModal();return}
    case 'addCode':{const c=$('#newCode').value.trim().replace(/[\[\]]/g,'').toUpperCase();if(c)DB.set('settings/roomCodes/'+c.replace(/[.#$\/]/g,'_'),'-');return}
    case 'delCode':{const c=b.dataset.c;const n=allEvents().filter(e=>e.code===c).length;if(n&&!confirm(`[${c}] aparece en ${n} evento(s). Si lo borras, esos actos quedarán sin sala hasta que la elijas a mano. ¿Borrar?`))return;return DB.set('settings/roomCodes/'+c,null)}
    case 'export':{const blob=new Blob([JSON.stringify(DB.data,null,1)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=`ateneo-copia-${ymd(new Date())}.json`;l.click();return}
    case 'import': return $('#impFile').click();
    case 'exportInv':{const cols=['origin','baseRoom','location','category','name','qty','status','desc','serial','notes','supplier','rentFrom','rentTo'];
      const csv=[cols.join(';')].concat(vals(ITEMS()).map(it=>cols.map(c=>`"${String(it[c]??'').replace(/"/g,'""')}"`).join(';'))).join('\n');
      const l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));l.download='inventario-ateneo.csv';l.click();return}
    case 'resetDemo': if(confirm('¿Borrar los datos de prueba y empezar de nuevo?')){localStorage.removeItem('ateneo-demo');location.reload()} return;
  }}catch(err){toast(err.message||String(err),5000)}
});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL.parts)closeModal()});
function unassign(id,i){const it=ITEMS()[i];const up={[`events/${id}/mat/${i}`]:null,[`events/${id}/_matU`]:stamp()};
  if(it?.origin==='alquiler'&&it.eventId===id&&confirm('Es un alquiler solo de este acto. ¿Eliminarlo también del inventario?'))up[`items/${i}`]=null;return DB.update(up)}

/* ---------------- login ---------------- */
function showLogin(msg){
  $('#nav').innerHTML='';$('#userBox').innerHTML='';
  $('#view').innerHTML=`<div class="card login"><h2>Producción Ateneo</h2><p class="mut">Entra con tu cuenta de Google de Scope. Te pedirá permiso para leer el calendario del Ateneo y guardar las hojas en Drive.</p>
  ${msg?`<div class="alert err">${h(msg)}</div>`:''}<button class="btn pri" id="loginBtn">Entrar con Google</button></div>`;
  MOUNTED='';
  $('#loginBtn').onclick=async()=>{try{const r=await firebase.auth().signInWithPopup(provider());gTok={t:r.credential.accessToken,exp:Date.now()+50*60000};sessionStorage.setItem('gtok',JSON.stringify(gTok))}catch(e){showLogin(e.message)}};
}

/* ---------------- datos de prueba ---------------- */
function makeDemo(d){
  const base=new Date(); const day=n=>{const x=new Date(base.getTime()+n*864e5);return ymd(x)};
  const mk=(n,s,e,title,extra={})=>{const id='demo'+Object.keys(d.events).length;
    d.events[id]={gcal:{title,start:new Date(madridMs(day(n),s)).toISOString(),end:new Date(madridMs(day(n),e)).toISOString(),allDay:false,status:'confirmed',desc:extra.desc||'',link:''},...extra.x};return id};
  const find=(room,txt)=>Object.values(d.items).find(i=>i.baseRoom===room&&i.name.toLowerCase().includes(txt))?.id;
  const sc=txt=>Object.values(d.items).find(i=>i.origin==='scope'&&i.name.toLowerCase().includes(txt))?.id;
  mk(0,'10:00','12:00','[CAT] Acto institucional: presentación de la memoria anual',{x:{sheet:{RESPONSABLE:'IRENE',SITUACION:'ATENEO',ESTADO:'CONTACTADO',GRABACION:'SI, CON DOS CÁMARAS',STREAMING:'SI'},mat:{[find('CÁTEDRA MAYOR','atril')]:{qty:2,note:'Atril y mesa'},[find('CÁTEDRA MAYOR','diadema')]:{qty:2}}}});
  const c=mk(0,'19:00','20:30','[CCH] Concierto de cámara: Cuarteto Iberia',{desc:'Contacto: Laura (representante) 600 000 000',x:{
    notes:{n1:{subj:'Laura · Rider cuarteto',text:'Hola, os paso lo que necesitamos para el concierto:\n- 4 sillas sin brazos y 4 atriles de partitura\n- Amplificación ligera del cello (llevan su propio micro? NO)\n- Presentación al inicio con micro de mano\n- Llegarán a las 17:30 para ensayar',ts:Date.now()-3*36e5,by:'Ana',done:false},
      n2:{subj:'Laura · Grabación',text:'¿Sería posible grabar el audio del concierto? Nos gustaría tener una copia para redes.',ts:Date.now()-2*36e5,by:'Ana',done:false}},
    win:{cit:'17:00',fin:'21:15'},
    mat:{[find('PÉREZ GALDÓS','mano')]:{qty:2,note:'Presentación'},[sc('dpa')]:{qty:1,note:'Cello'}}}});
  mk(0,'19:00','21:00','[RYC] Conferencia: La generación del 27',{x:{mat:{[find('PÉREZ GALDÓS','mano')]:{qty:1,note:'Preguntas público'}},sheet:{PREGUNTAS:'SI'}}});
  mk(1,'18:30','20:00','[PG] Mesa redonda: periodismo y democracia');
  mk(1,'19:00','20:30','[CAT] Ciclo de cine: coloquio tras la proyección',{x:{sheet:{PROYECCIONES:'Proyección de película (DCP no, archivo MP4 en pendrive)',QLAB:'SI'}}});
  mk(2,'12:00','13:30','[LAR] Rueda de prensa');
  mk(3,'19:00','21:00','[UBE] Recital de poesía');
  mk(4,'18:00','20:00','[BIB] Presentación de libro');
  mk(4,'19:30','21:00','[SAL] Evento con código sin asignar');
  Object.values(d.events).forEach(e=>{if(e.mat)for(const k in e.mat)if(k==='undefined')delete e.mat[k]});
}

DB.init().then(()=>{route();
  if(DB.mode==='firebase'){
    setTimeout(()=>syncCalendar(false),1500);
    setInterval(()=>syncCalendar(false),10*60000);
  }
  setInterval(()=>updSync(),60000);
});
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
